name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Compile AGENTS.md
        run: node scripts/build-agents.mjs
      - name: Validate skills
        run: node scripts/validate.mjs
      - name: Test standalone skills, packaging and release isolation
        run: npm test

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint examples across rules
        run: node scripts/lint-examples.mjs
      - name: Fail if AGENTS.md is stale
        run: |
          if ! git diff --quiet -- 'skills/*/AGENTS.md'; then
            echo "AGENTS.md is out of date. Run: npm run build" >&2
            git diff --stat -- 'skills/*/AGENTS.md' >&2
            exit 1
          fi
